name: Ishizuki

options:
  bundleIdPrefix: studio.ishizuki
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  IshizukiKit:
    path: ..
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.3.0

targets:
  Ishizuki:
    type: application
    platform: macOS
    sources:
      - path: Ishizuki
      - path: ../assets/Ishizuki.icon
    dependencies:
      - package: IshizukiKit
        product: IshizukiKit
      - package: IshizukiKit
        product: IshizukiAgent
      - package: Highlightr
        product: Highlightr
    info:
      path: Ishizuki/Info.plist
      properties:
        CFBundleDisplayName: Ishizuki
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Sarah Truffle"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Ishizuki/Ishizuki.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ishizuki.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2WTR6KH74L
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: Ishizuki
